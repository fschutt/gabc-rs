[package]
name = "spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "M0: checks what the layout engines do with a hand-written chant line"

[dependencies]
printpdf = { version = "0.12.10", default-features = false, features = ["html"] }
azul-layout = { version = "0.0.18", default-features = false, features = ["std", "text_layout", "font_loading", "xml", "cpurender"] }
azul-core = { version = "0.0.18", default-features = false, features = ["std"] }
azul-css = { version = "0.0.18", default-features = false, features = ["parser"] }
rust-fontconfig = { version = ">=5.0.1, <5.1", default-features = false, features = ["std", "parsing"] }
