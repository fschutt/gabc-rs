[package]
name = "gabc-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gregorian chant (GABC) and hymn (ABC) notation to HTML, PDF and PNG"

[dependencies]

[workspace]
members = ["spike", "xtask"]

# The azul + printpdf stack is large and this machine's disk is nearly full:
# no debug info, and dependencies lightly optimized so layout and the CPU
# rasterizer run at a usable speed in dev builds.
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1

# Engine fixes that are not released yet (docs/engine-bugs.md), pinned by revision:
# fschutt/azul#484 and fschutt/printpdf#299 (which contains #298).
[patch.crates-io]
printpdf = { git = "https://github.com/fschutt/printpdf", rev = "18d02d42ac05408dde1c605f1aecc80290f879f7" }
azul-css = { git = "https://github.com/fschutt/azul", rev = "858b5e46f171cfc1c42bce2fbec87b88a4a3f1d6" }
azul-core = { git = "https://github.com/fschutt/azul", rev = "858b5e46f171cfc1c42bce2fbec87b88a4a3f1d6" }
azul-layout = { git = "https://github.com/fschutt/azul", rev = "858b5e46f171cfc1c42bce2fbec87b88a4a3f1d6" }
