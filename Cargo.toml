[package]
name = "gabc-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gregorian chant (GABC) and hymn (ABC) notation to HTML, PDF and PNG"

[dependencies]

[workspace]
members = ["spike", "xtask"]

# The azul + printpdf stack is large and this machine's disk is nearly full:
# no debug info, and dependencies lightly optimized so layout and the CPU
# rasterizer run at a usable speed in dev builds.
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1

# printpdf with SVG strokes written as PDF paths (docs/engine-bugs.md, E1), until
# https://github.com/fschutt/printpdf/pull/298 is released. Pinned by revision.
[patch.crates-io]
printpdf = { git = "https://github.com/fschutt/printpdf", rev = "634204cb386eb76dbdc0938f2e6600751b491717" }
