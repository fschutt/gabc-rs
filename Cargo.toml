[package]
name = "gabc-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gregorian chant (GABC) and hymn (ABC) notation to HTML, PDF and PNG"

[dependencies]
# Only for the `measure` feature: text widths from azul's text engine, the one that sets the
# text when the score becomes a PDF or a PNG.
azul-layout = { version = "0.0.19", default-features = false, features = ["std", "text_layout", "font_loading"], optional = true }
azul-css = { version = "0.0.19", default-features = false, optional = true }

[features]
# `measure::FontMeasure`: the real width of the lyrics in a given font, for `layout::Options::measure`.
measure = ["dep:azul-layout", "dep:azul-css"]

[workspace]
members = ["spike", "xtask", "wasm"]

# The azul + printpdf stack is large and this machine's disk is nearly full:
# no debug info, and dependencies lightly optimized so layout and the CPU
# rasterizer run at a usable speed in dev builds.
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1
